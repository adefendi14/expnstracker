server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export (`trailingSlash: true`):
    # serve real files / directory indexes. Never fall back to /index.html —
    # that breaks client navigations that fetch per-route flight payloads
    # (__next.*.txt / index.txt) by returning the homepage HTML instead.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
